name: Sentinel actions allowlist
description: >-
  Fails when a workflow or composite action uses a GitHub Action that is not on
  the approved list, or is not pinned to a version tag or commit SHA.
author: Tyrone Madison

inputs:
  policy-file:
    description: Allowlist policy. Defaults to the example policy bundled with this action.
    required: false
    default: ""
  paths:
    description: Space separated files or directories to scan.
    required: false
    default: .github/workflows

runs:
  using: composite
  steps:
    - name: Install changeset-sentinel
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH/../.."

    - name: Check action references
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.policy-file }}
        SCAN_PATHS: ${{ inputs.paths }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        POLICY="${POLICY_FILE:-$ACTION_PATH/../../policy/actions-allowlist.yml}"
        read -r -a paths <<< "$SCAN_PATHS"
        python -m sentinel allowlist --policy "$POLICY" "${paths[@]}"
