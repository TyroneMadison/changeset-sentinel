name: Sentinel AI review
description: >-
  Scores a change set with deterministic rules, asks Claude for a risk narrative
  and rollback plan, posts one sticky PR comment, and enforces the approval gate.
author: Tyrone Madison

inputs:
  changeset-file:
    description: describe-change-set JSON produced by the changeset action.
    required: true
  risk-threshold:
    description: LOW, MEDIUM, HIGH, CRITICAL or NONE. Risk at or above this blocks the merge.
    required: false
    default: HIGH
  llm-provider:
    description: bedrock, anthropic or none.
    required: false
    default: bedrock
  model-id:
    description: Bedrock model or inference profile ID, or an Anthropic model name.
    required: false
    default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  approval-label:
    description: PR label a human applies to accept a blocked risk.
    required: false
    default: risk-accepted
  checks:
    description: Newline separated name=outcome pairs from earlier steps, shown in the report.
    required: false
    default: ""
  github-token:
    description: Token used to read labels and post the PR comment.
    required: true

outputs:
  risk-level:
    description: Final risk level after the floor rule.
    value: ${{ steps.review.outputs.risk-level }}
  blocked:
    description: true when the gate blocks the merge.
    value: ${{ steps.review.outputs.blocked }}

runs:
  using: composite
  steps:
    - name: Install changeset-sentinel
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH/../.."

    - name: Review change set
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SENTINEL_CHECKS: ${{ inputs.checks }}
        CHANGESET_FILE: ${{ inputs.changeset-file }}
        RISK_THRESHOLD: ${{ inputs.risk-threshold }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        MODEL_ID: ${{ inputs.model-id }}
        APPROVAL_LABEL: ${{ inputs.approval-label }}
      run: |
        python -m sentinel review \
          --changeset "$CHANGESET_FILE" \
          --threshold "$RISK_THRESHOLD" \
          --provider "$LLM_PROVIDER" \
          --model-id "$MODEL_ID" \
          --approval-label "$APPROVAL_LABEL" \
          --output "$RUNNER_TEMP/sentinel-report.md" \
          --github
