name: infra-review-example-service

# Generated by changeset-sentinel scripts/new-service.sh
# Every PR that touches infra/example-service gets a change set, policy checks,
# and a Claude risk report before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - infra/example-service/**

permissions: {}

jobs:
  sentinel:
    uses: TyroneMadison/changeset-sentinel/.github/workflows/sentinel-review.yml@v1
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    with:
      template-path: infra/example-service/template.yaml
      stack-name: sentinel-example-service
      role-to-assume: ${{ vars.SENTINEL_ROLE_ARN }}
      risk-threshold: HIGH
