AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Starter stack for example-service, generated by changeset-sentinel. Encrypted
  queue with a dead letter queue, a log group with retention, and a runtime role
  with least privilege access to its own queue. Every change is reviewed on PRs.

Parameters:
  ServiceName:
    Type: String
    Default: example-service
    AllowedPattern: ^[a-z][a-z0-9-]{1,38}$
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  CostCenter:
    Type: String
    Default: platform
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 90, 365]

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_27
            comment: Encrypted with SSE-SQS (SqsManagedSseEnabled). Checkov only recognizes KMS keys for this check.
    Properties:
      QueueName: !Sub ${ServiceName}-${Environment}-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: !Ref ServiceName }
        - { Key: Owner, Value: TyroneMadison }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: CostCenter, Value: !Ref CostCenter }

  WorkQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_27
            comment: Encrypted with SSE-SQS (SqsManagedSseEnabled). Checkov only recognizes KMS keys for this check.
    Properties:
      QueueName: !Sub ${ServiceName}-${Environment}-work
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - { Key: Project, Value: !Ref ServiceName }
        - { Key: Owner, Value: TyroneMadison }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: CostCenter, Value: !Ref CostCenter }

  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Log groups use the CloudWatch service key by default; a CMK per starter service adds cost before there is data to protect.
    Properties:
      LogGroupName: !Sub /services/${ServiceName}/${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref ServiceName }
        - { Key: Owner, Value: TyroneMadison }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: CostCenter, Value: !Ref CostCenter }

  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub Runtime role for ${ServiceName}.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: own-queue-and-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt WorkQueue.Arn
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${ServiceLogGroup.Arn}:*
      Tags:
        - { Key: Project, Value: !Ref ServiceName }
        - { Key: Owner, Value: TyroneMadison }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: CostCenter, Value: !Ref CostCenter }

Outputs:
  WorkQueueUrl:
    Value: !Ref WorkQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  ServiceRoleArn:
    Value: !GetAtt ServiceRole.Arn
